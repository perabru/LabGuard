name: LabGuard Jogos - Windows EXE
on:
  push:
    branches: [main]
    paths: ['games/**', '.github/workflows/games-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: labguard-games-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Compile and verify on Windows PowerShell 5.1
        shell: powershell
        run: ./games/build.ps1
      - name: Upload verified Windows files and auditable source
        uses: actions/upload-artifact@v4
        with:
          name: LabGuard-Jogos-Windows-2.1.0
          path: |
            games/dist/LabGuard-Jogos.exe
            games/dist/LabGuard-Jogos-Windows.zip
            games/dist/SHA256SUMS.txt
            games/dist/build-info.json
            games/dist/LEIA-ME.md
            games/dist/Engine.assembled.ps1
            games/dist/LabGuard.assembled.cs
            games/dist/Guardian.assembled.cs
          if-no-files-found: error
      - name: Publish games release only after verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'jogos-v2.1.0'
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --title 'LabGuard Jogos 2.1.0 - YouTube, Xbox e fechamento automatico' --notes-file games/README.md --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag games/dist/LabGuard-Jogos.exe games/dist/LabGuard-Jogos-Windows.zip games/dist/SHA256SUMS.txt games/dist/build-info.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
