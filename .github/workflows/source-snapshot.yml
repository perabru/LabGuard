name: LabGuard - Fonte para manutencao
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Archive tracked source only
        run: git archive --format=zip --output=LabGuard-Fonte.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LabGuard-Fonte
          path: LabGuard-Fonte.zip
          retention-days: 3
          if-no-files-found: error
