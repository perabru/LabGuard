name: Compilar aplicações e servidores

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "server_main.py"
      - "labguard/**"
      - "gateway/**"
      - "server/**"
      - "tests/**"
      - "docs/**"
      - "!docs/VALIDACAO.md"
      - "packaging/**"
      - "scripts/**"
      - "requirements-build.txt"
      - "requirements.txt"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: labguard-release-${{ github.ref }}
  cancel-in-progress: true
env:
  LABGUARD_VERSION: "2.4.1"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Disponibilizar Tcl/Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Instalar dependências de execução
        run: python -m pip install -r requirements.txt
      - name: Executar testes sem alterar a rede
        run: python -m unittest discover -s tests -v
      - name: Validar configuração do gateway
        run: python gateway/agent.py --config gateway/config.example.json --validate-config
      - name: Validar recursos do servidor
        run: python server_main.py --self-test --output /tmp/server-self-test.json

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar ferramentas de empacotamento
        run: python -m pip install -r requirements-build.txt
      - name: Validar descoberta alternativa no Windows PowerShell 5.1
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./packaging/validate_discovery_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "A validação nativa da descoberta Windows falhou." }
      - name: Validar preferências privadas e cofre do Windows
        shell: pwsh
        run: |
          python packaging/validate_startup_windows.py
          if ($LASTEXITCODE -ne 0) { throw "A validação nativa de preferências e cofre falhou." }
      - name: Testar componentes compatíveis com Windows
        shell: pwsh
        run: |
          $patterns = @("test_desktop.py", "test_gui.py", "test_integrations.py", "test_integration_gui.py", "test_server.py", "test_banlist.py", "test_banlist_gui.py", "test_remote.py", "test_remote_gui.py", "test_network_map_gui.py", "test_reports.py", "test_controller.py", "test_discovery.py", "test_inventory.py", "test_updater.py", "test_preferences.py", "test_credential_store.py", "test_update_manifest.py", "test_local_dns.py", "test_simple_setup.py", "test_diagnostics.py", "test_direct_routeros.py", "test_simple_gui.py")
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "Testes falharam: $pattern" }
          }
      - name: Disponibilizar Inno Setup
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe")
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Não foi possível instalar o Inno Setup." }
          }
      - name: Gerar painel e servidor Windows
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version $env:LABGUARD_VERSION
      - name: Validar atualização real isolada da 2.4 para a 2.4.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $oldDirectory = Join-Path $env:RUNNER_TEMP "LabGuardPreviousRelease"
          New-Item -ItemType Directory -Path $oldDirectory | Out-Null
          gh release download v2.4.0 --pattern LabGuard-Setup.exe --dir $oldDirectory
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível obter o instalador anterior para validação." }
          $oldSetup = Join-Path $oldDirectory "LabGuard-Setup.exe"
          $installDir = Join-Path $env:LOCALAPPDATA "LabGuardUpdateSmoke\Installed App"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./packaging/validate_updater_windows.ps1 -OldSetup $oldSetup -NewSetup "$PWD\dist\release\LabGuard-Setup.exe" -InstallDir $installDir
          if ($LASTEXITCODE -ne 0) { throw "A atualização nativa isolada não passou na validação." }
      - name: Testar instalador e abertura do painel
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "LabGuardInstalled"
          $setup = (Resolve-Path "dist/release/LabGuard-Setup.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Instalação falhou: $($install.ExitCode)" }
          $exe = Join-Path $installDir "LabGuard.exe"
          $report = Join-Path $env:RUNNER_TEMP "LabGuard-self-test.json"
          $check = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--output", "`"$report`"") -Wait -PassThru
          if ($check.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Autoteste do painel não concluiu." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.catalog_services -lt 1 -or $result.integration_profiles -lt 4 -or $result.identification_help_steps -lt 3 -or $result.inventory_summary_check -cne "ok" -or $result.preferences_check -cne "ok" -or $result.update_helper_check -cne "ok") { throw "Recursos empacotados incompletos." }
          $app = Start-Process -FilePath $exe -ArgumentList @("--demo") -PassThru
          Start-Sleep -Seconds 4
          $app.Refresh()
          if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw "A janela do painel não abriu." }
          $app.CloseMainWindow() | Out-Null
          if (-not $app.WaitForExit(10000)) { $app.Kill() }
          Copy-Item $report "dist/release/windows-self-test.json"
          $dnsReport = Join-Path $env:RUNNER_TEMP "LabGuard-dns-self-test.json"
          $dnsCheck = Start-Process -FilePath $exe -ArgumentList @("--dns-self-test", "--output", "`"$dnsReport`"") -Wait -PassThru
          if ($dnsCheck.ExitCode -ne 0) { throw "Teste DNS empacotado falhou." }
          $dnsResult = Get-Content $dnsReport -Raw | ConvertFrom-Json
          if (-not $dnsResult.ok -or -not $dnsResult.udp_blocked -or -not $dnsResult.tcp_blocked -or -not $dnsResult.listeners_closed) { throw "DNS nativo incompleto." }
          Copy-Item $dnsReport "dist/release/windows-dns-self-test.json"
      - name: Testar servidor Windows como serviço nativo
        shell: pwsh
        run: |
          $server = (Resolve-Path "dist/LabGuardServer/LabGuardServer.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "LabGuard-server-self-test.json"
          & $server --self-test --output $report
          if ($LASTEXITCODE -ne 0) { throw "Autoteste do servidor falhou." }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw "Recursos do servidor incompletos." }
          $configDirectory = Join-Path $env:RUNNER_TEMP "LabGuard Server Config"
          $serviceDirectory = Join-Path $env:RUNNER_TEMP "LabGuard Server Installed"
          foreach ($path in @($configDirectory, $serviceDirectory)) {
            New-Item -ItemType Directory -Force $path | Out-Null
            $acl = Get-Acl -LiteralPath $path
            $users = [Security.Principal.SecurityIdentifier]::new("S-1-5-32-545")
            $rule = [Security.AccessControl.FileSystemAccessRule]::new($users, "FullControl", "ContainerInherit, ObjectInherit", "None", "Allow")
            $acl.AddAccessRule($rule)
            Set-Acl -LiteralPath $path -AclObject $acl
          }
          try {
            # Windows PowerShell 5.1 e caminhos com espaços: o host padrão do
            # Windows Server não possui o novo quoting nativo do pwsh 7.3+.
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./server/install-server.ps1 -Executable $server -Directory $configDirectory -InstallDirectory $serviceDirectory -Demo -Start
            if ($LASTEXITCODE -ne 0) { throw "A instalação pelo Windows PowerShell 5.1 falhou." }
            $expectedCommand = '"' + (Join-Path $serviceDirectory "LabGuardServer.exe") + '" run --service --directory "' + $configDirectory + '" --demo'
            $imagePath = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\LabGuardServer' -Name ImagePath).ImagePath
            if ($imagePath -cne $expectedCommand) { throw "O ImagePath do serviço não preservou as aspas e os argumentos." }
            $aclPaths = @($configDirectory, $serviceDirectory, (Join-Path $serviceDirectory "LabGuardServer.exe"), (Join-Path $configDirectory "config.json"), (Join-Path $configDirectory "secrets.json"), (Join-Path $configDirectory "access-tokens.txt"), (Join-Path $configDirectory "logs"), (Join-Path $configDirectory "data"))
            foreach ($path in $aclPaths) {
              $acl = Get-Acl -LiteralPath $path
              if (-not $acl.AreAccessRulesProtected) { throw "A DACL não foi protegida: $path" }
              $allowed = @("S-1-5-32-544", "S-1-5-18", "S-1-5-19")
              if ((Split-Path -Leaf $path) -eq "access-tokens.txt") { $allowed = @("S-1-5-32-544", "S-1-5-18") }
              foreach ($entry in $acl.Access) {
                $sid = $entry.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
                if ($sid -notin $allowed) { throw "Permissão inesperada permaneceu na instalação: $path / $sid" }
              }
            }
            $healthy = $false
            for ($n = 0; $n -lt 30; $n++) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/healthz" -TimeoutSec 2; if ($r.StatusCode -eq 200) { $healthy = $true; break } } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw "O serviço Windows não respondeu à verificação local." }
            if ((Get-Service LabGuardServer).Status -ne "Running") { throw "O serviço SCM não permaneceu ativo." }
          } finally {
            Stop-Service LabGuardServer -ErrorAction SilentlyContinue
            sc.exe delete LabGuardServer | Out-Null
          }
          Copy-Item $report "dist/release/windows-server-self-test.json"
      - name: Preservar pacotes Windows verificados
        uses: actions/upload-artifact@v4
        with:
          name: LabGuard-Windows-${{ env.LABGUARD_VERSION }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Instalar dependências de compilação e teste gráfico
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb x11-utils openssh-client iproute2 libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libfreetype6 libxcb1
          python -m pip install -r requirements-build.txt
      - name: Gerar pacotes Linux desktop e servidor
        run: bash scripts/build_linux.sh "$LABGUARD_VERSION"
      - name: Testar instalação Debian e janela real
        run: |
          sudo dpkg -i dist/release/LabGuard-Linux-amd64.deb
          labguard --self-test --output /tmp/linux-desktop-self-test.json
          xvfb-run -a python packaging/linux/gui_smoke.py /opt/labguard/LabGuard
          cp /tmp/linux-desktop-self-test.json dist/release/linux-self-test.json
          labguard --dns-self-test --output /tmp/linux-dns-self-test.json
          cp /tmp/linux-dns-self-test.json dist/release/linux-dns-self-test.json
      - name: Testar servidor Linux com systemd
        run: |
          dist/LabGuardServer/LabGuardServer --self-test --output /tmp/linux-server-self-test.json
          trap 'sudo systemctl stop labguard-server.service || true' EXIT
          sudo bash server/install-server.sh --executable "$PWD/dist/LabGuardServer/LabGuardServer" --demo --start
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("O serviço systemd não respondeu à verificação local.")
          PY
          sudo systemctl is-active --quiet labguard-server.service
          cp /tmp/linux-server-self-test.json dist/release/linux-server-self-test.json
      - name: Preservar pacotes Linux verificados
        uses: actions/upload-artifact@v4
        with:
          name: LabGuard-Linux-${{ env.LABGUARD_VERSION }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: LabGuard-*-${{ env.LABGUARD_VERSION }}
          path: release
          merge-multiple: true
      - name: Gerar somas e publicar versão completa
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python packaging/build_update_manifest.py --directory release --version "$LABGUARD_VERSION"
          cd release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          tag="v$LABGUARD_VERSION"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'A versão já existe. Atualize o número antes de uma nova publicação.' >&2
            exit 1
          fi
          cat > /tmp/release-notes.txt <<'EOF'
          LabGuard 2.4.1: três ações para configurar, gerenciar sites e testar; assistente DNS em três etapas para Vivo e switch simples.

          Assistente com Ligar filtro, Usar nos computadores e Testar, seleção de interface real e diagnóstico local UDP/TCP por botão. O assistente acompanha o término da leitura inicial sem manter o botão de início desativado. O próprio computador atende DNS UDP/TCP e filtra os domínios aplicados pelo banco de sites. Somente consultas recebidas são registradas; não há inspeção de HTTPS nem garantia de cobertura de toda a rede.

          É necessário configurar o DNS no DHCP/LAN do roteador, se o modelo permitir, ou nas estações. O programa não altera o Vivo, o switch, o firewall ou o DNS dos computadores sozinho. O PC do filtro precisa permanecer ligado; o aplicativo avisa antes de parar. VPN, DoH, DNS alternativo/IPv6 e cache exigem políticas complementares.

          O novo modo não corta internet por IP/MAC nem controla portas de switch não gerenciável. A integração direta RouterOS e o gateway anterior continuam opcionais. A versão preserva atualização Windows por usuário, credenciais no cofre e autorização explícita.

          Os pacotes passam por testes de DNS real no loopback UDP/TCP, instaladores e serviços Windows/Linux e atualização real isolada 2.4 → 2.4.1. Nenhum equipamento da escola foi acessado ou homologado.
          EOF
          gh release create "$tag" ./* --repo "$GH_REPO" --target "$GITHUB_SHA" --title "LabGuard $LABGUARD_VERSION" --notes-file /tmp/release-notes.txt --latest
